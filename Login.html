            "The verification link configuration needs to be checked in Firebase.",
        "auth/invalid-continue-uri":
            "The verification link configuration is invalid."
    };

    return messages[error.code] ||
        `Unable to complete the request (${error.code || "unknown error"}). Please try again later.`;
}

// Resend verification email
resendButton.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
        status.textContent =
            "Enter your account email and password first.";
        return;
    }

    setBusy(true);
    status.textContent = "Checking your account...";

    let user = null;

    try {
        const credential = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        user = credential.user;

        await reload(user);

        if (user.emailVerified) {
            await signOut(auth);
            user = null;

            status.textContent =
                "Your email is already verified. You can log in now.";

            return;
        }

        status.textContent = "Sending a new verification email...";

        await sendEmailVerification(user);

        await signOut(auth);
        user = null;

        status.textContent =
            "A new verification email has been sent. " +
            "Check your inbox and Spam folder. " +
            "If it does not arrive, wait a little before requesting another.";

    } catch (error) {
        console.error("Resend verification error:", error);
        status.textContent = getErrorMessage(error);

    } finally {
        if (user) {
            try {
                await signOut(auth);
            } catch (signOutError) {
                console.error("Sign-out error:", signOutError);
            }
        }

        setBusy(false);
    }
});
